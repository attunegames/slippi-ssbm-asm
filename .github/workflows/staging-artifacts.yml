# Staging only. Do NOT port this file to feature/rooms.
#
# It exists so a build can be downloaded and run on a real machine before any
# of the work is presented. Upstream's build_check.yml is deliberately left
# untouched next to it, including its clean-git-action step, which asserts the
# build reproduces the committed Output/ byte for byte - that is Slippi's
# convention and a contribution should keep it, committing the rebuilt ini
# rather than deleting the check.
name: Staging Artifacts

on:
  push:
    branches:
      - "**"

jobs:
  codeset:
    name: "Build and keep the codeset"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Build codeset"
        working-directory: ${{ github.workspace }}
        run: |
          sudo docker run --volume=${PWD}:/work --workdir=/work \
            nikhilnarayana/devkitpro-slippi:latest make ini list

      # Only once there are modules to build. Same devkitPro image, so
      # powerpc-eabi-gcc is already present.
      - name: "Build m-ex modules"
        id: mex
        if: hashFiles('Rooms/Modules/Makefile') != ''
        working-directory: ${{ github.workspace }}
        run: |
          sudo docker run --volume=${PWD}:/work --workdir=/work/Rooms/Modules \
            nikhilnarayana/devkitpro-slippi:latest make
          ls -l Rooms/Modules/out

      - name: "Upload codeset"
        uses: actions/upload-artifact@v4
        with:
          name: netplay-codeset
          path: |
            Output/Netplay/GALE01r2.ini
            Output/Netplay/GALJ01r2.ini
            Output/InjectionLists/list_netplay.json

      - name: "Upload m-ex modules"
        if: steps.mex.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mex-modules
          path: Rooms/Modules/out/*.dat
