name: Build Check

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  ubuntu64:
    name: "Build Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Build"
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          sudo docker run --volume=${PWD}:/work --workdir=/work nikhilnarayana/devkitpro-slippi:latest make ini list
      # Peppy fork: upstream ends with clean-git-action, which asserts the build
      # reproduces the committed Output/ byte for byte. That is the right check
      # for them and the wrong one for us - every asm change we make is supposed
      # to change the ini. We keep the built codeset instead, since it is the
      # thing our Dolphin build needs to ship.
      - name: "Upload codeset"
        uses: actions/upload-artifact@v4
        with:
          name: netplay-codeset
          path: |
            Output/Netplay/GALE01r2.ini
            Output/Netplay/GALJ01r2.ini
